<!DOCTYPE html>

<head>
    <title>Log in page</title>

</head>
<body >
    <center>
    <h1><mark>User Registretion Page for Job</mark></h1>
    <hr>
    <br>

    <form action="#">
        <table >


            <tr>
                <td>Full Name : </td>
                <td colspan="3"> <input type="text" placeholder="Enter your name" required><br><br></td>
            </tr>

            <tr>
                <td>Email :</td>
                <td><input name="email" placeholder="Enter Email"></input><br><br></td>
            </tr>

            <tr>
                <td>Mobile Number : </td>
                <td colspan="3"> <input type="number" placeholder="Enter Mobile Number" required><br><br></td>
            </tr>

            <tr>
                <td>Birth Date :</td>
                <td><input type="date" placeholder="Enter your DOB"><br><br></td>
            </tr>

             <tr>
                <td>Address :</td>
                <td><textarea name="Addresss" placeholder="Address"></textarea><br><br></td>
            </tr>

            <tr>
                <td> Gender :</td>
                <td><input type="radio" name="gender" value="female">
                    <label for="female">Female</label>
               <input type="radio" name="gender" value="male">
                <label for="male">male</label>
                </td>
                <br><br>
            </tr>

             <tr>
                <td>Qualification :</td>
                <td>
                    <select name="qualification"> 
                        <option>Select Qualification</option>
                        <option value="MBA">MBA</option>
                        <option value="MBA">MCA</option>
                        <option value="MBA">BE</option>
                    </select><br><br>
                </td>
            </tr>

              <tr>
                <td> Upload File :</td>
                <td><input type="file" placeholder="Upload file"><br><br></td>
            </tr>
            
            <tr ><br>
              <br><td colspan="1" > <center><button type="submit">Register</button></td></center>
              <td colspan="1" > <button type="reset">Reset</button></td>

            </tr>




       </table>
        </form>
</center>
</body>
</html>
