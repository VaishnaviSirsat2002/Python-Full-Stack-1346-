<!DOCTYPE html>

<head>
    <title>Signal Light by Div</title>
    <style>
        .box{
            border:solid 2px;
            height:300px;
            width:200px;
            margin-left:500px;
            margin-top:100px;
            padding:30px;
        }

        .red{ background-color:red;}
        .orange{background-color:orange;}
        .green{background-color:green;}

        .container{
           height:60px;
           width:60px;
           margin:40px;
           border-radius:40px;
        }
    </style>
</head>

<body>
    <div class="box">
        <center>
        <div  class=" container red"></div>
        <div class="container orange"></div>
        <div class="container green"></div>
        </center>
    </div>


   
</body>

</html>
